# Source of truth for the Xcode project. Generate with the pinned XcodeGen (see Mintfile):
#   mint run yonaskolb/XcodeGen@2.42.0 xcodegen generate
# BunnList.xcodeproj is generated output and is not committed.
name: BunnList
options:
  minimumXcodeGenVersion: 2.42.0
  bundleIdPrefix: dev.devmohd
  developmentLanguage: ar
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    # Signed with the developer team — required for Sign in with Apple.
    DEVELOPMENT_TEAM: U8874JC7QW
    CODE_SIGN_STYLE: Automatic
packages:
  BunnListCore:
    path: Packages/BunnListCore
targets:
  BunnList:
    type: application
    platform: iOS
    sources:
      - path: BunnList
    dependencies:
      - package: BunnListCore
    info:
      path: BunnList/Support/Info.plist
      properties:
        CFBundleDevelopmentRegion: ar
        CFBundleDisplayName: بن لست
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [ar, en]
        LSRequiresIPhoneOS: true
        # No non-exempt encryption → skips the export-compliance prompt on upload.
        ITSAppUsesNonExemptEncryption: false
        # Default (Arabic) value; ar.lproj/en.lproj InfoPlist.strings localize it.
        NSCameraUsageDescription: نستخدم الكاميرا لتصوير كيس القهوة وقراءة بياناته لإضافته إلى مجموعتك.
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.devmohd.bunnlist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: BunnList/Support/BunnList.entitlements
  BunnListTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BunnListTests
    dependencies:
      - target: BunnList
      - package: BunnListCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.devmohd.bunnlist.tests
  BunnListUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BunnListUITests
    dependencies:
      - target: BunnList
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.devmohd.bunnlist.uitests
schemes:
  BunnList:
    build:
      targets:
        BunnList: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BunnListTests
        - BunnListUITests
